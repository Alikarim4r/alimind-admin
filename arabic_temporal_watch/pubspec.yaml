name: arabic_temporal_watch
description: AI-powered dynamic Arabic astronomical prayer watch
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.6 is the floor for digit separators (1_000_000), used in the
  # astronomical maths; it ships with Flutter 3.27.
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  # flutter_localizations pins intl to an exact version that changes with the
  # Flutter SDK (0.19.x on Flutter 3.19–3.24, 0.20.x on 3.27+). A range keeps
  # `pub get` resolving on both instead of failing version solving. Only
  # NumberFormat is used, and its API is identical across the two.
  intl: ">=0.19.0 <0.21.0"
  vector_math: ^2.1.4
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  just_audio: ^0.9.36
  sensors_plus: ^4.0.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: ArabicDisplay
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
