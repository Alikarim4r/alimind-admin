// App-level build configuration for the arabic_temporal_watch module.

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34

    // Namespace mirrors the applicationId and is required by AGP 8+.
    namespace 'com.alimind.arabic_temporal_watch'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'com.alimind.arabic_temporal_watch'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        // Enables multidex support for apps that exceed the 64K method limit.
        multiDexEnabled true

        // Inject the version into BuildConfig for runtime access.
        buildConfigField 'String', 'APP_VERSION', '"1.0.0"'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            debuggable true
            minifyEnabled false
        }

        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )

            // Signing config should be provided via a keystore.properties file
            // that is NOT committed to version control.
            // signingConfig signingConfigs.release
        }
    }

    // Suppress lint errors that would otherwise abort the release build.
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }
}

flutter {
    source '../..'
}

dependencies {
    // Kotlin standard library
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'

    // Multidex support for API < 21 (still useful as a transitive dep)
    implementation 'androidx.multidex:multidex:2.0.1'

    // Window manager — allows Flutter to handle edge-to-edge display correctly
    implementation 'androidx.window:window:1.2.0'
}
